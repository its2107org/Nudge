name: Build Nudge
run-name: Build Nudge (${{ github.event_name }})
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Nudge/**", "NudgeWidget/**", "Shared/**", "project.yml"]
  schedule:
    # A fresh TestFlight build on the 1st of every month, so it never expires (they last 90 days).
    - cron: "17 4 1 * *"

concurrency:
  group: build-nudge
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Check Apple details are available
        run: |
          missing=""
          for name in TEAMID GH_PAT FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All Apple details found." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install fastlane
        run: bundle install

      - name: Patch match tables
        run: |
          TABLE_PRINTER_PATH=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"; fi

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Register identifiers and signing
        run: bundle exec fastlane setup

      - name: Check the app exists in App Store Connect
        run: |
          bundle exec fastlane check_app_record
          if [ "$(cat fastlane/app_record_exists.txt)" != "true" ]; then
            echo "::error::Nudge hasn't been added in App Store Connect yet (bundle ID com.$TEAMID.nudge)."
            echo "Nudge hasn't been added in App Store Connect yet." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build
        run: bundle exec fastlane build_nudge

      - name: Send to TestFlight
        run: bundle exec fastlane release

      - name: Keep build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: buildlog
          if-no-files-found: ignore
